# Факты для заполнения анкет работодателей.
# Скопируйте в profile.yaml (он в .gitignore) и заполните.
# Если поля здесь нет, а форма его требует, бот не станет выдумывать,
# оставит его пустым (статус needs_input) — допишете через forms.cli fix.

full_name: ""          # Фамилия Имя Отчество
first_name: ""
last_name: ""
email: ""
phone: ""              # +7 999 123-45-67
telegram: ""           # @username
city: ""
timezone: "МСК"
birth_date: ""         # 01.01.1995, можно оставить пустым
hh_resume_url: ""      # https://hh.ru/resume/...
portfolio_url: ""
linkedin_url: ""

salary_expectation: "" # например: от 150 000 ₽ на руку
work_format: "удалённо"
employment: "полная занятость"
start_date: "через 2 недели после оффера"
experience_years: "3+"
relocation: "не рассматриваю"
english_level: ""

# Готовые ответы на частые вопросы (модель возьмёт их почти дословно)
faq:
  "Почему ищете работу": ""
  "Почему интересна наша компания": ""
  "Самый сильный кейс": ""

# Свободный текст: что ещё модель может использовать в ответах
extra: |
